<text x="57" y="205" fill="#c1cddd" font-family="Arial, Helvetica, sans-serif" font-size="23">Python. Backend. Automation.</text>
<text x="57" y="259" fill="#778ba4" font-family="monospace" font-size="15">From an idea to a running service.</text>
